# GitHub Pages builds this site with Jekyll on every push to main (no Actions to maintain).
# Pages with front matter use the shared layouts in _layouts/ and the includes in _includes/;
# files without front matter (images, scripts) are copied as they are.
title: Cosmic Shore
description: The party game for pilots, by Froglet Games.
url: https://www.froglet.games
baseurl: ""

# Blog: posts are Markdown files in _posts/ named YYYY-MM-DD-slug.md; drafts are kept off this public repo (README.md)
# and are never published. A post's URL is /blog/<slug>/ (set under defaults, so it does not
# touch the pages: privacy.html stays privacy.html and is served at /privacy).
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed   # built into GitHub Pages: writes /blog/feed.xml
feed:
  path: blog/feed.xml

# Developer profiles: one file per person in _team/ (edited in Froglet Studio at /admin/), each
# published at /team/<file name>/ with _layouts/profile.html.
collections:
  team:
    output: true
    permalink: /team/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools

defaults:
  - scope: { path: "", type: pages }
    values: { layout: default }
  - scope: { path: "", type: team }
    values: { layout: profile }
  - scope: { path: "", type: posts }
    values: { layout: post, author: The Froglet Team, permalink: "/blog/:title/", content_width: 760px }
