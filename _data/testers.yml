# Test sign-ups from the "Get the Game" launch pad (_includes/tester-signup.html). Where the form sends
# them: _data/forms.yml.

# What each card offers a test of. The key is what the form sends; the label is what people read.
platforms:
  - key: windows
    label: Windows PC
  - key: ios
    label: iPhone & iPad
  - key: android
    label: Android

# "How did you hear about us?" choices. "Other" opens a text box.
heard:
  - Discord
  - Reddit
  - YouTube
  - TikTok
  - Instagram
  - X / Twitter
  - Steam
  - A friend
  - An event
  - Search
  - Other
