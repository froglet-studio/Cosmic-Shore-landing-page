# The site's themes (the theme pill in the top bar). The six swatches are each set's domains, Fire, Gold, Lime,
# Jade, Blue, Ruby, from the game's colour sets (Docs/VesselModels/colour_sets.json in the game repo); the UI tokens
# for each are in css/hypersea.css (html.th-<id>). Photic is the default.
- id: photic
  name: Photic
  group: Hypersea
  line: 'The game as it was authored: one paint per domain on the deep sea.'
  swatches:
  - '#FE5645'
  - '#FFAE00'
  - '#99FF80'
  - '#00D4FF'
  - '#4D8BFF'
  - '#A600FF'
- id: nocturne
  name: Nocturne
  group: Hypersea
  line: 'Lanterns: rims glow in their own hue over night-dark jewel faces.'
  swatches:
  - '#E8614E'
  - '#ECBD44'
  - '#B4E232'
  - '#4BD5D4'
  - '#739AFB'
  - '#DF5CE4'
