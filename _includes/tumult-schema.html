{%- comment -%} Structured data for /tumult/ (schema.org VideoGame with its trailer and screenshots), rendered in the page head. {%- endcomment -%}
{%- assign tm = site.data.tumult -%}
{%- assign page_url = page.url | absolute_url -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "VideoGame",
      "@id": "{{ page_url }}#game",
      "name": "Tumult",
      "url": "{{ page_url }}",
      "description": {{ page.description | jsonify }},
      "genre": ["Tabletop RPG", "Board game", "Tactics", "Strategy"],
      "playMode": ["SinglePlayer", "CoOp"],
      "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 2 },
      "gamePlatform": ["Web browser", "PC", "Mac", "Phone", "Tablet"],
      "applicationCategory": "Game",
      "operatingSystem": "Any (plays in a web browser)",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      {%- if tm.live %}
      "sameAs": "{{ tm.play_url }}",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "availability": "https://schema.org/InStock", "url": "{{ tm.play_url }}" },
      {%- endif %}
      "author": { "@id": "{{ '/' | absolute_url }}#froglet" },
      "publisher": { "@id": "{{ '/' | absolute_url }}#froglet" },
      "image": "{{ '/assets/tumult/share.jpg' | absolute_url }}",
      "screenshot": [
        { "@type": "ImageObject", "contentUrl": "{{ '/assets/tumult/mission.webp' | absolute_url }}", "caption": "A mission: enemies show their next move before you act" },
        { "@type": "ImageObject", "contentUrl": "{{ '/assets/tumult/draft.webp' | absolute_url }}", "caption": "The draft: pick two pilots from eleven bloodlines" },
        { "@type": "ImageObject", "contentUrl": "{{ '/assets/tumult/route.webp' | absolute_url }}", "caption": "The route: choose the next stop across Tumult" },
        { "@type": "ImageObject", "contentUrl": "{{ '/assets/tumult/title.webp' | absolute_url }}", "caption": "The title screen" }
      ],
      "trailer": {
        "@type": "VideoObject",
        "name": "Tumult gameplay: three rounds of a mission",
        "description": "Two pilots play their trait cards and dice against enemies that show what they will do next.",
        "thumbnailUrl": "{{ '/assets/tumult/clip-poster.webp' | absolute_url }}",
        "contentUrl": "{{ '/assets/tumult/tumult-clip.mp4' | absolute_url }}",
        "uploadDate": "{{ tm.clip_date }}",
        "duration": "PT{{ tm.clip_seconds }}S"
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ '/' | absolute_url }}#froglet",
      "name": "Froglet Games",
      "url": "{{ '/' | absolute_url }}",
      "logo": "{{ '/assets/branding/favicon-256.png' | absolute_url }}"
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Froglet Games", "item": "{{ '/' | absolute_url }}" },
        { "@type": "ListItem", "position": 2, "name": "Tumult", "item": "{{ page_url }}" }
      ]
    }
  ]
}
</script>
